<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box{
            width: 100px;
            height: 100px;
            border: 1px solid #000;
            background-color: gray;
            margin: 50px;
            padding: 50px;
            
        }
        .inline-box{
            /* block: 마진 상쇄가 발생할수있다.
            display: block; */
            display: inline-block;
        }
    </style>
</head>
<body>
    <!-- div태그5개 안에 p태그 -->
    <!-- ctrl+d -->
    <!-- alt+화살표 -->
     <!-- div.box -->
     <div class="box">div 태그</div>
     <span class="box inline-box">span 태그</span>
     <!-- inline은 상하마진이 안먹힌다 -->
    
    
    
    
</body>
</html>
