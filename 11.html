<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    div p {
      color: blue;
      
    }
    div > p {
      color: crimson;
      
    }

  </style>
</head>
<body>
  <div><p>자식</p></div>
  <div><span><p>손자</p></span></div>
  <div><p>자식</p></div>
</body>
</html>

<!-- 자식은 부모바로 밑이고, 자손을 부모아래 모든 요소들입니다. -->
