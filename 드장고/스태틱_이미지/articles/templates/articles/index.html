

{% extends "base.html" %}


{% block content %}

{% load static %}

<h1>Articles</h1>
<img src="{% static 'images/마이클잭슨.jpg' %}" alt="sample image"><br>
<a href="{% url "articles:create" %}">CREATE</a>
<hr>
{% for article in articles %}
    <div>
        <p>글 번호: {{article.pk}}</p>
        <p>
            글 제목: <a href="{% url "articles:detail" article.pk %}">{{article.title}}</a>
        </p>
        <p>글 내용: {{article.content}}</p>
    </div>
<hr>
{% endfor %}

{% endblock content %}
